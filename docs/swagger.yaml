definitions:
  exam_feature_model.CreateProductRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 255
        type: string
      price:
        type: number
      sale_price:
        type: number
    required:
    - name
    - price
    type: object
  exam_feature_model.CreateSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/exam_feature_model.Product'
      error_code:
        type: string
      successful:
        example: true
        type: boolean
    type: object
  exam_feature_model.ErrorResponse:
    properties:
      error_code:
        type: string
      errors: {}
      successful:
        example: false
        type: boolean
    type: object
  exam_feature_model.Product:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      price:
        type: number
      sale_price:
        type: number
      updated_at:
        type: string
    type: object
  exam_feature_model.UpdateProductRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 255
        type: string
      price:
        type: number
      sale_price:
        type: number
    type: object
  exam_feature_model.UpdateSuccessResponse:
    properties:
      successful:
        example: true
        type: boolean
    type: object
info:
  contact: {}
paths:
  /product:
    post:
      consumes:
      - application/json
      description: Creates a product with name, price, and optional description/sale_price
      parameters:
      - description: Product to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/exam_feature_model.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successful creation
          schema:
            $ref: '#/definitions/exam_feature_model.CreateSuccessResponse'
        "400":
          description: BODY_PARSER_ERROR, VALIDATOR_ERROR
          schema:
            $ref: '#/definitions/exam_feature_model.ErrorResponse'
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            $ref: '#/definitions/exam_feature_model.ErrorResponse'
      summary: Create a new product
      tags:
      - products
  /product/{id}:
    patch:
      consumes:
      - application/json
      description: |-
        Partial update — only send fields you want to change.
        "name" and "price" cannot be cleared, only updated or omitted.
        "description" and "sale_price" can be omitted (no change), set to null (clear the value), or set to a new value.
      parameters:
      - description: Product ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/exam_feature_model.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successful update
          schema:
            $ref: '#/definitions/exam_feature_model.UpdateSuccessResponse'
        "400":
          description: MISSING_PRODUCT_ID, INVALID_PRODUCT_ID, BODY_PARSER_ERROR,
            or VALIDATOR_ERROR
          schema:
            $ref: '#/definitions/exam_feature_model.ErrorResponse'
        "500":
          description: INTERNAL_SERVER_ERROR
          schema:
            $ref: '#/definitions/exam_feature_model.ErrorResponse'
      summary: Partially update a product
      tags:
      - products
swagger: "2.0"
